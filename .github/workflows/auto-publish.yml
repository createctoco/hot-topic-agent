# ============================================
# 热搜自动发文 - GitHub Actions 工作流
# 每天 8:00-22:00（北京时间）每2小时自动发文1篇
# ============================================
name: 热搜自动发文

on:
  # 定时触发（UTC时间，北京时间 = UTC+8）
  # 0:00 UTC = 8:00 北京, 14:00 UTC = 22:00 北京
  schedule:
    - cron: "0 0,2,4,6,8,10,12,14 * * *"  # 每2小时，共8次
  # 手动触发
  workflow_dispatch:
    inputs:
      count:
        description: "本次发布文章数量"
        required: false
        default: "1"
      dry_run:
        description: "仅生成不发布（true=只写文章不发头条）"
        required: false
        default: "false"

# 同一时间只允许一个实例运行
concurrency:
  group: hot-topic-agent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ====== 1. 检出代码 ======
      - name: 检出代码
        uses: actions/checkout@v4

      # ====== 2. 安装 Python ======
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ====== 3. 安装 Node.js ======
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ====== 4. 安装 Python 依赖 ======
      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      # ====== 5. 安装 Node 依赖 ======
      - name: 安装 Node 依赖
        run: npm install

      # ====== 6. 安装 Playwright 浏览器 ======
      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      # ====== 7. 注入头条 Cookie ======
      - name: 注入头条登录 Cookie
        run: |
          mkdir -p data/auth data/.toutiao-session
          if [ -n "${{ secrets.TOUTIAO_COOKIES }}" ]; then
            echo '${{ secrets.TOUTIAO_COOKIES }}' > data/auth/cookies.json
            echo "Cookie 已注入"
          else
            echo "WARNING: TOUTIAO_COOKIES 未配置，头条发布可能失败"
          fi

      # ====== 8. 恢复发布历史（防重复）======
      - name: 恢复发布历史
        uses: actions/cache@v4
        with:
          path: data/published.json
          key: published-history-${{ github.run_id }}
          restore-keys: |
            published-history-

      # ====== 9. 执行发文 ======
      - name: 执行发文
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NON_INTERACTIVE: "1"
          TZ: "Asia/Shanghai"
        run: |
          echo "=== 开始执行 $(date) ==="
          COUNT="${{ github.event.inputs.count || '1' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run 模式：仅生成文章，不发布到头条"
            python3 main.py --test-filter
          else
            python3 main.py --once --count $COUNT
          fi

      # ====== 10. 上传文章产物（供查看）======
      - name: 上传文章产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: articles-${{ github.run_number }}
          path: |
            data/articles/
            data/logs/
          if-no-files-found: ignore
          retention-days: 7

      # ====== 11. 保存发布历史 ======
      - name: 保存发布历史
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/published.json
          key: published-history-${{ github.run_id }}
