# ============================================
# 热搜自动发文 - GitHub Actions 工作流
# ============================================
name: 热搜自动发文

on:
  # 定时触发（UTC时间，北京时间 = UTC+8）
  schedule:
    - cron: "0 2 * * *"  # 每天北京时间 10:00 执行一次
  # 手动触发
  workflow_dispatch:
    inputs:
      count:
        description: "本次发布文章数量"
        required: false
        default: "1"
      dry_run:
        description: "仅生成不发布（true=只写文章不发头条）"
        required: false
        default: "false"

# 同一时间只允许一个实例运行
concurrency:
  group: hot-topic-agent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ====== 1. 检出代码 ======
      - name: 检出代码
        uses: actions/checkout@v4

      # ====== 2. 安装 Python ======
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ====== 3. 安装 Node.js ======
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ====== 4. 安装 Python 依赖 ======
      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      # ====== 5. 安装 Node 依赖（toutiao-ops + playwright node版）======
      - name: 安装 Node 依赖
        run: npm install

      # ====== 6. 安装 Node.js Playwright 浏览器（用于 Cookie 注入 + toutiao-ops）======
      - name: 安装 Node Playwright 浏览器
        run: npx playwright install chromium --with-deps

      # ====== 7. 生成配置文件（注意用双引号 EOF，使环境变量生效）======
      - name: 生成 config.yaml
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          cat > config.yaml << EOF
          daily_count: 1
          deepseek:
            api_key: "${DEEPSEEK_API_KEY}"
            base_url: "https://api.deepseek.com"
            model: "deepseek-chat"
          publish:
            first_publish: true
            ai_declared: true
            interval_seconds: 90
          hot_search:
            platforms:
              - baidu
              - weibo
              - zhihu
              - toutiao
            request_interval: 0.5
          categories:
            - 跨境电商
            - 外贸
            - AI
            - 科技
          logging:
            level: INFO
            save_days: 30
          EOF
          echo "config.yaml 已生成"
          # 验证 API Key 是否写入（只打印前几个字符）
          python3 -c "import yaml; c=yaml.safe_load(open('config.yaml')); k=c['deepseek']['api_key']; print(f'API Key 前缀: {k[:8]}...' if k and k != 'None' else '❌ API Key 为空！')"

      # ====== 8. 注入头条 Cookie ======
      - name: 注入头条登录 Cookie
        env:
          TOUTIAO_COOKIES: ${{ secrets.TOUTIAO_COOKIES }}
        run: |
          mkdir -p data/auth
          if [ -n "$TOUTIAO_COOKIES" ]; then
            printf '%s' "$TOUTIAO_COOKIES" > data/auth/cookies.json
            echo "Cookie 文件已写入，开始注入到浏览器会话..."
            node scripts/inject-cookies.mjs
            echo "✅ Cookie 注入成功"
          else
            echo "⚠️ WARNING: TOUTIAO_COOKIES 未配置，将跳过头条发布"
          fi

      # ====== 9. 恢复发布历史（防重复）======
      - name: 恢复发布历史
        uses: actions/cache@v4
        with:
          path: data/published.json
          key: published-history-${{ github.run_id }}
          restore-keys: |
            published-history-

      # ====== 10. 执行发文 ======
      - name: 执行发文
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NON_INTERACTIVE: "1"
          TZ: "Asia/Shanghai"
        run: |
          echo "=== 开始执行 $(date) ==="
          COUNT="${{ github.event.inputs.count }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"

          # 默认值（定时触发时 inputs 为空，默认正式发布）
          if [ -z "$COUNT" ]; then COUNT="1"; fi
          if [ -z "$DRY_RUN" ]; then DRY_RUN="false"; fi

          echo "发布数量: $COUNT，Dry Run: $DRY_RUN"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run 模式：仅生成文章，不发布到头条"
            python3 main.py --once --dry-run --count $COUNT
          else
            echo "正式发布模式"
            python3 main.py --once --count $COUNT
          fi

      # ====== 11. 上传文章产物（供查看）======
      - name: 上传文章产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: articles-${{ github.run_number }}
          path: |
            data/articles/
            data/logs/
          if-no-files-found: ignore
          retention-days: 7

      # ====== 12. 保存发布历史 ======
      - name: 保存发布历史
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/published.json
          key: published-history-${{ github.run_id }}
